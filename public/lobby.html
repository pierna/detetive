<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sala de Espera - Detetive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="lobby-body">
  <div class="lobby-container">
    <div class="lobby-header">
      <h2>Sala</h2>
      <div class="room-code" id="room-code">----</div>
      <button id="btn-copy" class="btn btn-small">Copiar Link</button>
    </div>

    <div class="lobby-main">
      <div class="players-section">
        <h3>Jogadores (<span id="player-count">0</span>/6)</h3>
        <ul id="players-list"></ul>
        <button id="btn-start" class="btn btn-primary btn-big" disabled>Iniciar Jogo</button>
        <div id="lobby-error" class="error hidden"></div>
      </div>

      <div class="characters-section">
        <h3>Escolha seu personagem</h3>
        <div id="characters-grid" class="characters-grid"></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/art.js"></script>
  <script src="js/lobby.js"></script>
</body>
</html>
